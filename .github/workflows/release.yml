# A version tag is the Dart release: apps depend on this repository at the tag
# (README, Install). This job checks the tag deserves to be one, and writes the
# GitHub release. When the packages move to pub.dev, publishing joins it here.
name: Release

on:
  push:
    tags: ['[0-9]+.[0-9]+.[0-9]+']

permissions:
  contents: write

jobs:
  release:
    name: GitHub release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0

      - name: The tag is on main, and every manifest and changelog agrees with it
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "::error::$GITHUB_REF_NAME is not on main"; exit 1; }
          for pubspec in localaze/pubspec.yaml localaze_flutter/pubspec.yaml; do
            grep -q "^version: $GITHUB_REF_NAME$" "$pubspec" || { echo "::error::$pubspec is not at $GITHUB_REF_NAME"; exit 1; }
          done
          python3 contract/scripts/changelog-entry.py "$GITHUB_REF_NAME" localaze/CHANGELOG.md localaze_flutter/CHANGELOG.md > "$RUNNER_TEMP/notes.md"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.41.6
          cache: true

      - name: Test
        run: |
          (cd localaze && dart pub get && dart test)
          (cd localaze_flutter && flutter pub get && flutter analyze)

      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/notes.md" --verify-tag
