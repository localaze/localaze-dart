# Every pull request and every push to main runs the whole suite against the
# contract pinned at contract/. localaze-contract also calls this workflow with
# a proposed contract commit, so a contract change shows what it would break
# here before it merges.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      contract-ref:
        description: A localaze-contract commit to test against instead of the pinned one
        type: string
        required: false

permissions:
  contents: read

concurrency:
  # Named for this repository: in a call from localaze-contract, github.repository
  # is the caller's, and the three SDKs would cancel one another.
  group: ci-dart-${{ github.ref }}-${{ inputs.contract-ref }}
  cancel-in-progress: true

jobs:
  dart:
    name: Dart and Flutter
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Named explicitly: when another repository calls this workflow, a bare
      # checkout would fetch the caller.
      - uses: actions/checkout@v7
        with:
          repository: localaze/localaze-dart
          ref: ${{ inputs.contract-ref && 'main' || '' }}
          submodules: recursive

      - name: Use the proposed contract
        if: inputs.contract-ref
        run: |
          git -C contract fetch --depth 1 origin "${{ inputs.contract-ref }}"
          git -C contract checkout --quiet FETCH_HEAD
          echo "Testing against contract $(git -C contract rev-parse --short HEAD)"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.41.6
          cache: true

      - name: Runtime and generator
        working-directory: localaze
        run: |
          dart pub get
          dart analyze --fatal-infos
          dart test

      - name: The README's examples
        run: |
          python3 contract/scripts/check-snippets.py README.md
          # The example uses the golden generated file, so it is the generator's
          # real output, not a hand-edited copy.
          cmp localaze/example/localaze.g.dart localaze/test/generator/golden/localaze.g.dart
          cd localaze
          dart run example/main.dart > ../renders.txt
          head -4 ../renders.txt | diff - <(printf 'Выход\nДобро пожаловать, Аян\nУ вас 1 сообщение\nУ вас 11 сообщений\n')

      - name: Flutter binding
        working-directory: localaze_flutter
        run: |
          flutter pub get
          flutter analyze

      - name: Flutter example
        working-directory: examples/flutter_app
        run: |
          flutter pub get
          flutter analyze
          flutter test
